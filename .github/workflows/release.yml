name: release

# Push a tag such as v1.0.0 to build installers and attach them to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet test JSONConverterPro.sln -c Release
      - name: Build EXE, portable ZIP and installer
        run: ./publish.ps1 -Installer
      - name: Smoke test the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/release/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\JSON Converter Pro\JSONConverterPro.exe"
          if (-not (Test-Path $exe)) { throw "Installed EXE not found at $exe" }
          $p = Start-Process $exe -PassThru; Start-Sleep 12
          if ($p.HasExited) { throw "Installed app exited early ($($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with: { name: windows-release, path: dist/release/* }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet test JSONConverterPro.sln -c Release
      - run: ./publish.sh mac
      - uses: actions/upload-artifact@v4
        with: { name: macos-release, path: dist/release/*.dmg }

  publish:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
